<h2>Список сообщений</h2>
<table>
    <thead>
        <tr>
            <th>Тема</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for message in messages %}
        <tr>
            <td>{{ message.subject }}</td>
            <td>
                <a href="{% url 'edit_message' message.id %}">Редактировать</a>
                <form method="POST" action="{% url 'delete_message' message.id %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Удалить</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{% url 'add_message' %}">Добавить новое сообщение</a>
