<h2>Список получателей</h2>
<table>
    <thead>
        <tr>
            <th>Email</th>
            <th>Ф. И. О.</th>
            <th>Комментарий</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for recipient in recipients %}
        <tr>
            <td>{{ recipient.email }}</td>
            <td>{{ recipient.full_name }}</td>
            <td>{{ recipient.comment }}</td>
            <td>
                <a href="{% url 'edit_recipient' recipient.id %}">Редактировать</a>
                <form method="POST" action="{% url 'delete_recipient' recipient.id %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Удалить</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{% url 'add_recipient' %}">Добавить нового получателя</a>
